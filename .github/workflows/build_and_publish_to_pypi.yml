name: Build and Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            CIBW_ARCHS_LINUX: "x86_64"
          - os: windows-latest
            CIBW_ARCHS_WINDOWS: "AMD64"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Windows needs Visual Studio for C++ compilation
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==2.16.2

      - name: Build wheels
        env:
          # Target CPython versions
          CIBW_BUILD: "cp311-* cp312-*"

          # Skip 32-bit and musllinux
          CIBW_SKIP: "*-win32 *-manylinux_i686 *-musllinux_*"

          # Use newer manylinux image for better compiler support
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28

          # Architectures (from matrix)
          CIBW_ARCHS_LINUX: ${{ matrix.CIBW_ARCHS_LINUX }}
          CIBW_ARCHS_WINDOWS: ${{ matrix.CIBW_ARCHS_WINDOWS }}

          # Pre-install build dependencies
          CIBW_BEFORE_BUILD: >
            python -m pip install --upgrade pip &&
            python -m pip install setuptools wheel "numpy>=2.0.0" "cython>=3.0.0"

          # Increase verbosity
          CIBW_BUILD_VERBOSITY: 3

        run: python -m cibuildwheel --output-dir wheelhouse

      - name: List built wheels
        shell: bash
        run: |
          echo "Built wheels:"
          ls -la wheelhouse/

      - name: Verify wheel contents
        shell: bash
        run: |
          for wheel in wheelhouse/*.whl; do
            if [ -f "$wheel" ]; then
              echo "===== Checking $wheel ====="
              python -m zipfile -l "$wheel" > wheel_contents.txt
              if grep -E "path_algorithms.*\.(pyd|so)" wheel_contents.txt; then
                echo "✓ path_algorithms extension found"
              else
                echo "✗ WARNING: path_algorithms extension not found!"
              fi
              if grep -E "path_core.*\.(pyd|so)" wheel_contents.txt; then
                echo "✓ path_core extension found"
              else
                echo "✗ WARNING: path_core extension not found!"
              fi
              rm wheel_contents.txt
            fi
          done

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel build
          python -m pip install "numpy>=2.0.0" "cython>=3.0.0"

      - name: Build source distribution
        run: python -m build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  test-wheels:
    name: Test wheels on ${{ matrix.os }} Python ${{ matrix.python }}
    needs: [build-wheels]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.11"
          - os: windows-latest
            python: "3.12"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: cibw-wheels-*
          merge-multiple: true
          path: wheelhouse/

      - name: Install and test wheel
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1
        run: |
          # Find the right wheel for this Python version and OS
          PYVER=$(python -c "import sys; print(f'cp{sys.version_info.major}{sys.version_info.minor}')")
          
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            WHEEL=$(ls wheelhouse/pyorps*${PYVER}*win*.whl 2>/dev/null | head -n1)
          else
            WHEEL=$(ls wheelhouse/pyorps*${PYVER}*linux*.whl 2>/dev/null | head -n1)
          fi
          
          if [ -z "$WHEEL" ]; then
            echo "ERROR: Could not find wheel for Python ${PYVER} on ${RUNNER_OS}"
            ls -la wheelhouse/
            exit 1
          fi
          
          echo "Installing wheel: $WHEEL"
          python -m pip install --upgrade pip
          python -m pip install "$WHEEL[full]" --force-reinstall
          
          # Test imports
          python -c "
import sys
print('Python:', sys.version)
import pyorps
print('pyorps imported from:', pyorps.__file__)

try:
    import pyorps.utils.path_algorithms as pa
    print('✓ path_algorithms imported from:', pa.__file__)
except ImportError as e:
    print(f'✗ ERROR importing path_algorithms: {e}')
    sys.exit(1)

try:
    import pyorps.utils.path_core as pc
    print('✓ path_core imported from:', pc.__file__)
except ImportError as e:
    print(f'✗ ERROR importing path_core: {e}')
    sys.exit(1)

print('SUCCESS: All modules imported!')
"

      - name: Run pytest tests
        if: matrix.os == 'ubuntu-latest' || (matrix.os == 'windows-latest' && matrix.python == '3.11')
        run: |
          python -m pip install pytest
          cd tests
          python -m pytest . --tb=short --import-mode=importlib -v

  publish:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist, test-wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Collect distributions
        run: |
          mkdir -p upload
          find dist -name "*.whl" -exec cp {} upload/ \;
          find dist -name "*.tar.gz" -exec cp {} upload/ \;
          echo "Files to upload:"
          ls -la upload/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload/
