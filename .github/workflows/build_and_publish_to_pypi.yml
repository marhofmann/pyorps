name: Build and Publish to PyPI

# Release procedure (details in CONTRIBUTING.md):
#   1. merge everything to main and let "Tests" (lint and the test matrix) pass;
#   2. rehearse with a release candidate tag (vX.Y.ZrcN): builds, tests and publishes to TestPyPI only;
#   3. push the final tag vX.Y.Z last, on a commit that is already on main. Never delete or move a tag.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  gate:
    name: Release gate (tag = version, commit on main)
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.gate.outputs.prerelease }}
    steps:
      - name: Checkout code (full history, to see origin/main)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check the tag against pyproject.toml, pyorps/__init__.py and main
        id: gate
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python tools/check_release_tag.py "$GITHUB_REF_NAME"
          else
            echo "manual run (no tag): dry run, nothing will be published"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    needs: gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archs: "x86_64"
            skip: "*-win32 *-manylinux_i686 *-musllinux_i686"
            test_skip: "*-manylinux_*"
            before_build: "python -m pip install --upgrade pip 'setuptools>=77' wheel 'packaging>=24.2' 'numpy>=2.0.0' 'cython>=3.0.0' && python -m pip list"
          - os: windows-latest
            archs: "AMD64"
            skip: "*-win32"
            before_build: "python -m pip install --upgrade pip setuptools>=77 wheel packaging>=24.2 numpy>=2.0.0 cython>=3.0.0"
          - os: macos-15
            archs: "arm64"
            before_build: "brew install libomp && python -m pip install --upgrade pip setuptools>=77 wheel packaging>=24.2 numpy>=2.0.0 cython>=3.0.0"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==4.3.5

      # CPython 3.15 wheels are built by default since cibuildwheel 4.2.0; 4.3.5 builds with CPython 3.15.2.
      # cibuildwheel 4 downloads its virtualenv helper with retries and checks its SHA-256, so the old pre-seeding of
      # that download (a workaround for the 503 answers of cibuildwheel 2.23.3) is gone.
      # The per-OS settings come from the matrix; the Linux-only and macOS-only options are ignored on other systems.
      - name: Build wheels
        env:
          CIBW_BUILD: "cp312-* cp313-* cp314-* cp315-*"
          CIBW_SKIP: ${{ matrix.skip }}
          CIBW_ARCHS: ${{ matrix.archs }}
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BEFORE_BUILD: ${{ matrix.before_build }}
          CIBW_TEST_SKIP: ${{ matrix.test_skip }}
          # equals the runner (macos-15): the bundled Homebrew libomp is built for the runner's macOS
          CIBW_ENVIRONMENT_MACOS: "MACOSX_DEPLOYMENT_TARGET=15.0"
          CIBW_BUILD_VERBOSITY: 2
        run: python -m cibuildwheel --output-dir wheelhouse

      - name: Verify wheel contents
        shell: bash
        run: |
          echo "Checking wheel contents for Cython extensions..."
          for wheel in wheelhouse/*.whl; do
            if [ -f "$wheel" ]; then
              echo "===== Checking $wheel ====="
              python -m zipfile -l "$wheel" | grep -E "_heap.*\.(pyd|so)" || echo "WARNING: _heap extension not found!"
              python -m zipfile -l "$wheel" | grep -E "_raster_context.*\.(pyd|so)" || echo "WARNING: _raster_context extension not found!"
              python -m zipfile -l "$wheel" | grep -E "_dijkstra.*\.(pyd|so)" || echo "WARNING: _dijkstra extension not found!"
              python -m zipfile -l "$wheel" | grep -E "_delta_stepping.*\.(pyd|so)" || echo "WARNING: _delta_stepping extension not found!"
              echo ""
            fi
          done

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build-sdist:
    name: Build source distribution
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=77" wheel "packaging>=24.2"
          python -m pip install build "numpy>=2.0.0" "cython>=3.0.0"

      - name: Build source distribution
        run: python -m build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  test-wheels:
    name: Test built wheels on hosts
    needs: [build-wheels, build-sdist]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
        python: ["3.12", "3.13", "3.14", "3.15"]

    steps:
      - name: Checkout code (for tests only)
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            tests
            profiles
          sparse-checkout-cone-mode: false

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          pattern: cibw-wheels-*
          merge-multiple: true
          path: wheelhouse/

      - name: Upgrade pip
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install wheel on Linux (with full extra)
        if: runner.os == 'Linux'
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          cd /tmp
          PYVER=$(echo $PYTHON_VERSION | tr -d '.')
          WHEEL=$(ls $GITHUB_WORKSPACE/wheelhouse/pyorps*cp${PYVER}*linux*.whl 2>/dev/null | head -n1)
          if [ -z "$WHEEL" ]; then
            WHEEL=$(ls $GITHUB_WORKSPACE/wheelhouse/pyorps*.whl | head -n1)
          fi
          echo "Installing wheel: $WHEEL"
          python -m pip install "${WHEEL}[full]" --force-reinstall

          python <<'EOF'
          import sys, os
          assert 'pyorps' not in os.listdir('.'), "Still in source directory!"
          import pyorps
          print("Python version:", sys.version)
          print("pyorps imported from:", pyorps.__file__)
          for mod_name in ['_heap', '_raster_context', '_dijkstra', '_delta_stepping']:
              mod = __import__(f'pyorps.utils.{mod_name}', fromlist=[mod_name])
              print(f"{mod_name} imported from: {mod.__file__}")
          import pyorps.utils.path_algorithms as pa
          import pyorps.utils.path_core as pc
          print("SUCCESS: All extensions loaded correctly!")
          EOF

      - name: Install wheel on Windows (with full extra)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          Set-Location $env:TEMP
          $pyver = $env:PYTHON_VERSION -replace '\.',''
          $wheel = Get-ChildItem "$env:GITHUB_WORKSPACE\wheelhouse\pyorps*cp${pyver}*win*.whl" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $wheel) {
            $wheel = Get-ChildItem "$env:GITHUB_WORKSPACE\wheelhouse\pyorps*.whl" | Select-Object -First 1
          }
          Write-Host "Installing wheel: $wheel"
          python -m pip install "$wheel[full]" --force-reinstall

          python -c @"
          import sys, os
          assert 'pyorps' not in os.listdir('.'), 'Still in source directory!'
          import pyorps
          print('Python version:', sys.version)
          for mod_name in ['_heap', '_raster_context', '_dijkstra', '_delta_stepping']:
              mod = __import__(f'pyorps.utils.{mod_name}', fromlist=[mod_name])
              print(f'{mod_name} imported from: {mod.__file__}')
          import pyorps.utils.path_algorithms as pa
          import pyorps.utils.path_core as pc
          print('SUCCESS: All extensions loaded correctly!')
          "@

      - name: Install wheel on macOS (without networkit)
        if: runner.os == 'macOS'
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          cd /tmp
          PYVER=$(echo $PYTHON_VERSION | tr -d '.')
          WHEEL=$(ls $GITHUB_WORKSPACE/wheelhouse/pyorps*cp${PYVER}*macos*.whl 2>/dev/null | head -n1)
          if [ -z "$WHEEL" ]; then
            WHEEL=$(ls $GITHUB_WORKSPACE/wheelhouse/pyorps*.whl | head -n1)
          fi
          echo "Installing wheel: $WHEEL"

          # Install without [full] — networkit requires OpenMP which is
          # difficult to set up on macOS. Install graph extras individually.
          # --prefer-binary: when the newest release of a dependency has no wheel for this runner, pip takes the
          # newest release that has one instead of compiling the source distribution (rasterio 1.5.2 had wheels
          # for macOS 15 only while this job still ran on macOS 14).
          python -m pip install "${WHEEL}[dev]" --prefer-binary --force-reinstall
          python -m pip install rustworkx python-igraph networkx || true

          python <<'EOF'
          import sys, os
          assert 'pyorps' not in os.listdir('.'), "Still in source directory!"
          import pyorps
          print("Python version:", sys.version)
          print("pyorps imported from:", pyorps.__file__)
          for mod_name in ['_heap', '_raster_context', '_dijkstra', '_delta_stepping']:
              mod = __import__(f'pyorps.utils.{mod_name}', fromlist=[mod_name])
              print(f"{mod_name} imported from: {mod.__file__}")
          import pyorps.utils.path_algorithms as pa
          import pyorps.utils.path_core as pc
          print("SUCCESS: All extensions loaded correctly!")
          EOF

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run full tests on Linux from a temp directory
        if: runner.os == 'Linux'
        shell: bash
        run: |
          TMPDIR=$(mktemp -d)
          cp -r tests "$TMPDIR"/tests_run
          cp -r profiles "$TMPDIR"/profiles   # tests read ../profiles
          cp -r profiles "$TMPDIR"/tests_run/profiles   # and profiles/ relative to the working directory
          cd "$TMPDIR"/tests_run
          python -m pytest . --tb=short --import-mode=importlib

      - name: Run full tests on Windows 3.12 from a temp directory
        if: runner.os == 'Windows' && matrix.python == '3.12'
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1
        run: |
          $tmp = Join-Path $env:TEMP "tests_run_ci"
          New-Item -ItemType Directory -Path $tmp -Force | Out-Null
          Copy-Item -Recurse -Force tests (Join-Path $tmp "tests_run")
          Copy-Item -Recurse -Force profiles (Join-Path $tmp "profiles")   # tests read ../profiles
          Copy-Item -Recurse -Force profiles (Join-Path $tmp "tests_run\profiles")   # and profiles/ relative to the working directory
          Set-Location (Join-Path $tmp "tests_run")
          python -m pytest . --tb=short --import-mode=importlib

      # Python 3.12 ran the full tests above; 3.13 and later only get this smoke test (LLVM teardown assertion).
      - name: Smoke test on Windows (extension imports)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1
        run: |
          Set-Location $env:TEMP
          python -c @"
          import pyorps
          import pyorps.utils._heap
          import pyorps.utils._raster_context
          import pyorps.utils._dijkstra
          import pyorps.utils._delta_stepping
          import pyorps.utils.path_algorithms as m
          import pyorps.utils.path_core as c
          print('SUCCESS: All modules imported correctly!')
          "@

      - name: Smoke test on macOS (full tests run on Linux/Windows)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd /tmp
          python -c "
          import pyorps
          from pyorps import PathFinder, GeoRasterizer, CostAssumptions
          from pyorps import Path, PathCollection
          from pyorps.utils import CYTHON_AVAILABLE
          assert CYTHON_AVAILABLE, 'Cython extensions not loaded'
          import pyorps.utils._heap
          import pyorps.utils._raster_context
          import pyorps.utils._dijkstra
          import pyorps.utils._delta_stepping
          import pyorps.utils.path_algorithms
          import pyorps.utils.path_core
          print('SUCCESS: All macOS smoke tests passed')
          "

  publish:
    name: Publish to PyPI
    needs: [gate, build-wheels, build-sdist, test-wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.gate.outputs.prerelease == 'false'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          merge-multiple: true
          path: dist/

      - name: List all downloaded files
        run: |
          echo "Contents of dist/:"
          ls -la dist/

      - name: Collect distributions
        shell: bash
        run: |
          mkdir -p upload
          find dist -name "*.whl" -exec mv {} upload/ \; 2>/dev/null || true
          find dist -name "*.tar.gz" -exec mv {} upload/ \; 2>/dev/null || true
          echo "Files to be uploaded:"
          ls -la upload/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload/

  publish-testpypi:
    name: Publish release candidate to TestPyPI
    needs: [gate, build-wheels, build-sdist, test-wheels]
    runs-on: ubuntu-latest
    # One-time setup: a trusted publisher for this repository on https://test.pypi.org and a GitHub
    # environment called "testpypi". Release candidates never reach the real index.
    environment: testpypi
    permissions:
      id-token: write
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.gate.outputs.prerelease == 'true'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          merge-multiple: true
          path: dist/

      - name: Collect distributions
        shell: bash
        run: |
          mkdir -p upload
          find dist -name "*.whl" -exec mv {} upload/ \; 2>/dev/null || true
          find dist -name "*.tar.gz" -exec mv {} upload/ \; 2>/dev/null || true
          ls -la upload/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload/
          repository-url: https://test.pypi.org/legacy/
