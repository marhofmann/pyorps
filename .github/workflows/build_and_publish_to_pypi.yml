name: Build and Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            CIBW_ARCHS_LINUX: "x86_64"
          - os: windows-latest
            CIBW_ARCHS_WINDOWS: "AMD64"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==2.16.2

      - name: Build wheels
        env:
          # Target CPython versions
          CIBW_BUILD: "cp311-* cp312-*"
          # Skip 32-bit and musllinux if unsupported
          CIBW_SKIP: "*-win32 *-manylinux_i686 *-musllinux_i686"

          # Use newer manylinux image with GCC 12 for C++20 support
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28

          # Architectures (from matrix)
          CIBW_ARCHS_LINUX: ${{ matrix.CIBW_ARCHS_LINUX }}
          CIBW_ARCHS_WINDOWS: ${{ matrix.CIBW_ARCHS_WINDOWS }}

          # Build-time prerequisites - ensure Cython and numpy are installed
          CIBW_BEFORE_BUILD: >
            pip install --upgrade pip setuptools wheel &&
            pip install "numpy>=2.0.0" "cython>=3.0.0" &&
            pip list

          # Ensure the build uses setuptools properly
          CIBW_ENVIRONMENT: >
            SETUPTOOLS_USE_DISTUTILS=stdlib
            SETUPTOOLS_ENABLE_FEATURES=legacy-editable

          # Do not run tests inside manylinux containers
          CIBW_TEST_SKIP: "*-manylinux_*"

          # Increase verbosity to debug build issues
          CIBW_BUILD_VERBOSITY: 2

        run: python -m cibuildwheel --output-dir wheelhouse

      - name: Verify wheel contents
        shell: bash
        run: |
          echo "Checking wheel contents for Cython extensions..."
          for wheel in wheelhouse/*.whl; do
            echo "===== Checking $wheel ====="
            python -m zipfile -l "$wheel" | grep -E "path_algorithms.*\.(pyd|so)" || echo "WARNING: path_algorithms extension not found!"
            python -m zipfile -l "$wheel" | grep -E "path_core.*\.(pyd|so)" || echo "WARNING: path_core extension not found!"
            echo ""
          done

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install build "numpy>=2.0.0" "cython>=3.0.0"

      - name: Build source distribution
        run: python -m build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*

  test-wheels:
    name: Test built wheels on hosts
    needs: [build-wheels, build-sdist]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.11"
          - os: windows-latest
            python: "3.12"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: cibw-wheels-*
          merge-multiple: true
          path: wheelhouse/

      - name: Upgrade pip
        run: python -m pip install -U pip setuptools wheel

      - name: Install wheel on Linux (with full extra)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Install the wheel with full extras
          python -m pip install --find-links wheelhouse/ "pyorps[full]" --force-reinstall
          
          # Verify the installation
          python - <<'PY'
          import sys
          import pyorps
          import importlib.util
          
          print("Python version:", sys.version)
          print("pyorps imported from:", pyorps.__file__)
          
          # Check for Cython extensions
          try:
              import pyorps.utils.path_algorithms as pa
              print("path_algorithms extension imported from:", pa.__file__)
          except ImportError as e:
              print(f"ERROR: Could not import path_algorithms: {e}")
              sys.exit(1)
          
          try:
              import pyorps.utils.path_core as pc
              print("path_core extension imported from:", pc.__file__)
          except ImportError as e:
              print(f"ERROR: Could not import path_core: {e}")
              sys.exit(1)
          
          print("SUCCESS: All extensions loaded correctly!")
          PY

      - name: Install wheel on Windows (with full extra)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1
        run: |
          # Install the wheel with full extras
          python -m pip install --find-links wheelhouse/ "pyorps[full]" --force-reinstall
          
          # Verify the installation
          python -c @"
          import sys
          import pyorps
          import importlib.util
          
          print('Python version:', sys.version)
          print('pyorps imported from:', pyorps.__file__)
          
          # Check for Cython extensions
          try:
              import pyorps.utils.path_algorithms as pa
              print('path_algorithms extension imported from:', pa.__file__)
          except ImportError as e:
              print(f'ERROR: Could not import path_algorithms: {e}')
              sys.exit(1)
          
          try:
              import pyorps.utils.path_core as pc
              print('path_core extension imported from:', pc.__file__)
          except ImportError as e:
              print(f'ERROR: Could not import path_core: {e}')
              sys.exit(1)
          
          print('SUCCESS: All extensions loaded correctly!')
          "@

      - name: Run full tests on Linux from a temp directory
        if: runner.os == 'Linux'
        shell: bash
        run: |
          TMPDIR=$(mktemp -d)
          cp -r tests "$TMPDIR"/tests_run
          cd "$TMPDIR"/tests_run
          pytest . --tb=short --import-mode=importlib

      - name: Run full tests on Windows 3.11 from a temp directory
        if: runner.os == 'Windows' && matrix.python == '3.11'
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1
        run: |
          $tmp = Join-Path $env:TEMP "tests_run_ci"
          New-Item -ItemType Directory -Path $tmp -Force | Out-Null
          Copy-Item -Recurse -Force tests (Join-Path $tmp "tests_run")
          Set-Location (Join-Path $tmp "tests_run")
          python -m pytest . --tb=short --import-mode=importlib

      - name: Smoke test on Windows 3.12 (avoid LLVM teardown assertion)
        if: runner.os == 'Windows' && matrix.python == '3.12'
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1
        run: |
          python -c @"
          import pyorps
          import pyorps.utils.path_algorithms as m
          import pyorps.utils.path_core as c
          print('Imported pyorps:', pyorps.__file__)
          print('Imported path_algorithms extension:', m.__file__)
          print('Imported path_core extension:', c.__file__)
          print('SUCCESS: All modules imported correctly!')
          "@

  publish:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist, test-wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          merge-multiple: true
          path: dist/

      - name: Collect distributions
        shell: bash
        run: |
          shopt -s globstar nullglob
          mkdir -p upload
          mv dist/**/*.whl upload/ || true
          mv dist/**/*.tar.gz upload/ || true
          echo "Files to be uploaded:"
          ls -la upload/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload
