name: Build and Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            CIBW_ARCHS_LINUX: "x86_64"
          - os: windows-latest
            CIBW_ARCHS_WINDOWS: "AMD64"
          - os: macos-13
            CIBW_ARCHS_MACOS: "x86_64"
          - os: macos-14
            CIBW_ARCHS_MACOS: "arm64"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==2.21.0

      - name: Build wheels on Linux
        if: runner.os == 'Linux'
        env:
          CIBW_BUILD: "cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-win32 *-manylinux_i686 *-musllinux_i686"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_ARCHS_LINUX: ${{ matrix.CIBW_ARCHS_LINUX }}
          CIBW_BEFORE_BUILD: "python -m pip install --upgrade pip setuptools wheel && python -m pip install 'numpy>=2.0.0' 'cython>=3.0.0' && python -m pip list"
          CIBW_TEST_SKIP: "*-manylinux_*"
          CIBW_BUILD_VERBOSITY: 2
        run: python -m cibuildwheel --output-dir wheelhouse

      - name: Build wheels on Windows
        if: runner.os == 'Windows'
        env:
          CIBW_BUILD: "cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-win32"
          CIBW_ARCHS_WINDOWS: ${{ matrix.CIBW_ARCHS_WINDOWS }}
          CIBW_BEFORE_BUILD: "python -m pip install --upgrade pip setuptools wheel numpy>=2.0.0 cython>=3.0.0"
          CIBW_BUILD_VERBOSITY: 2
        run: python -m cibuildwheel --output-dir wheelhouse

      - name: Build wheels on macOS
        if: runner.os == 'macOS'
        env:
          CIBW_BUILD: "cp311-* cp312-* cp313-*"
          CIBW_ARCHS_MACOS: ${{ matrix.CIBW_ARCHS_MACOS }}
          CIBW_BEFORE_BUILD: "python -m pip install --upgrade pip setuptools wheel numpy>=2.0.0 cython>=3.0.0"
          CIBW_BUILD_VERBOSITY: 2
        run: python -m cibuildwheel --output-dir wheelhouse

      - name: Verify wheel contents
        shell: bash
        run: |
          echo "Checking wheel contents for Cython extensions..."
          for wheel in wheelhouse/*.whl; do
            if [ -f "$wheel" ]; then
              echo "===== Checking $wheel ====="
              python -m zipfile -l "$wheel" | grep -E "_heap.*\.(pyd|so)" || echo "WARNING: _heap extension not found!"
              python -m zipfile -l "$wheel" | grep -E "_raster_context.*\.(pyd|so)" || echo "WARNING: _raster_context extension not found!"
              python -m zipfile -l "$wheel" | grep -E "_dijkstra.*\.(pyd|so)" || echo "WARNING: _dijkstra extension not found!"
              python -m zipfile -l "$wheel" | grep -E "_delta_stepping.*\.(pyd|so)" || echo "WARNING: _delta_stepping extension not found!"
              echo ""
            fi
          done

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install build "numpy>=2.0.0" "cython>=3.0.0"

      - name: Build source distribution
        run: python -m build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  test-wheels:
    name: Test built wheels on hosts
    needs: [build-wheels, build-sdist]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.11"
          - os: windows-latest
            python: "3.12"
          - os: windows-latest
            python: "3.13"
          - os: macos-13
            python: "3.11"
          - os: macos-13
            python: "3.12"
          - os: macos-13
            python: "3.13"
          - os: macos-14
            python: "3.11"
          - os: macos-14
            python: "3.12"
          - os: macos-14
            python: "3.13"

    steps:
      - name: Checkout code (for tests only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tests
          sparse-checkout-cone-mode: false

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: cibw-wheels-*
          merge-multiple: true
          path: wheelhouse/

      - name: Upgrade pip
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install wheel on Linux (with full extra)
        if: runner.os == 'Linux'
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          # Move to a temp directory to avoid importing from source
          cd /tmp

          # Find the appropriate wheel for this Python version
          PYVER=$(echo $PYTHON_VERSION | tr -d '.')
          WHEEL=$(ls $GITHUB_WORKSPACE/wheelhouse/pyorps*cp${PYVER}*linux*.whl 2>/dev/null | head -n1)
          if [ -z "$WHEEL" ]; then
            WHEEL=$(ls $GITHUB_WORKSPACE/wheelhouse/pyorps*.whl | head -n1)
          fi
          echo "Installing wheel: $WHEEL"

          # Install the wheel with full extras
          python -m pip install "${WHEEL}[full]" --force-reinstall

          # Verify the installation FROM A DIFFERENT DIRECTORY
          python <<'EOF'
          import sys
          import os

          # Ensure we're not in the source directory
          assert 'pyorps' not in os.listdir('.'), "Still in source directory!"

          import pyorps

          print("Python version:", sys.version)
          print("pyorps imported from:", pyorps.__file__)

          # Check for Cython extensions (new modular structure)
          for mod_name in ['_heap', '_raster_context', '_dijkstra', '_delta_stepping']:
              try:
                  mod = __import__(f'pyorps.utils.{mod_name}', fromlist=[mod_name])
                  print(f"{mod_name} extension imported from: {mod.__file__}")
              except ImportError as e:
                  print(f"ERROR: Could not import {mod_name}: {e}")
                  sys.exit(1)

          # Check backward-compat shims
          import pyorps.utils.path_algorithms as pa
          import pyorps.utils.path_core as pc
          print("path_algorithms shim imported from:", pa.__file__)
          print("path_core shim imported from:", pc.__file__)

          print("SUCCESS: All extensions loaded correctly!")
          EOF

      - name: Install wheel on Windows (with full extra)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          # Move to temp directory to avoid importing from source
          Set-Location $env:TEMP

          # Find the appropriate wheel for this Python version
          $pyver = $env:PYTHON_VERSION -replace '\.',''
          $wheel = Get-ChildItem "$env:GITHUB_WORKSPACE\wheelhouse\pyorps*cp${pyver}*win*.whl" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $wheel) {
            $wheel = Get-ChildItem "$env:GITHUB_WORKSPACE\wheelhouse\pyorps*.whl" | Select-Object -First 1
          }
          Write-Host "Installing wheel: $wheel"

          # Install the wheel with full extras
          python -m pip install "$wheel[full]" --force-reinstall

          # Verify the installation FROM A DIFFERENT DIRECTORY
          python -c @"
          import sys
          import os

          # Ensure we're not in the source directory
          assert 'pyorps' not in os.listdir('.'), 'Still in source directory!'

          import pyorps

          print('Python version:', sys.version)
          print('pyorps imported from:', pyorps.__file__)

          # Check for Cython extensions
          try:
              import pyorps.utils.path_algorithms as pa
              print('path_algorithms extension imported from:', pa.__file__)
          except ImportError as e:
              print(f'ERROR: Could not import path_algorithms: {e}')
              sys.exit(1)

          try:
              import pyorps.utils.path_core as pc
              print('path_core extension imported from:', pc.__file__)
          except ImportError as e:
              print(f'ERROR: Could not import path_core: {e}')
              sys.exit(1)

          print('SUCCESS: All extensions loaded correctly!')
          "@

      - name: Install wheel on macOS (with full extra)
        if: runner.os == 'macOS'
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          # Move to a temp directory to avoid importing from source
          cd /tmp

          # Find the appropriate wheel for this Python version
          PYVER=$(echo $PYTHON_VERSION | tr -d '.')
          WHEEL=$(ls $GITHUB_WORKSPACE/wheelhouse/pyorps*cp${PYVER}*macos*.whl 2>/dev/null | head -n1)
          if [ -z "$WHEEL" ]; then
            WHEEL=$(ls $GITHUB_WORKSPACE/wheelhouse/pyorps*.whl | head -n1)
          fi
          echo "Installing wheel: $WHEEL"

          # Install the wheel with full extras
          python -m pip install "${WHEEL}[full]" --force-reinstall

          # Verify the installation FROM A DIFFERENT DIRECTORY
          python <<'EOF'
          import sys
          import os

          # Ensure we're not in the source directory
          assert 'pyorps' not in os.listdir('.'), "Still in source directory!"

          import pyorps

          print("Python version:", sys.version)
          print("pyorps imported from:", pyorps.__file__)

          # Check for Cython extensions (new modular structure)
          for mod_name in ['_heap', '_raster_context', '_dijkstra', '_delta_stepping']:
              try:
                  mod = __import__(f'pyorps.utils.{mod_name}', fromlist=[mod_name])
                  print(f"{mod_name} extension imported from: {mod.__file__}")
              except ImportError as e:
                  print(f"ERROR: Could not import {mod_name}: {e}")
                  sys.exit(1)

          # Check backward-compat shims
          import pyorps.utils.path_algorithms as pa
          import pyorps.utils.path_core as pc
          print("path_algorithms shim imported from:", pa.__file__)
          print("path_core shim imported from:", pc.__file__)

          print("SUCCESS: All extensions loaded correctly!")
          EOF

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run full tests on Linux from a temp directory
        if: runner.os == 'Linux'
        shell: bash
        run: |
          TMPDIR=$(mktemp -d)
          cp -r tests "$TMPDIR"/tests_run
          cd "$TMPDIR"/tests_run
          python -m pytest . --tb=short --import-mode=importlib

      - name: Run full tests on Windows 3.11 from a temp directory
        if: runner.os == 'Windows' && matrix.python == '3.11'
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1
        run: |
          $tmp = Join-Path $env:TEMP "tests_run_ci"
          New-Item -ItemType Directory -Path $tmp -Force | Out-Null
          Copy-Item -Recurse -Force tests (Join-Path $tmp "tests_run")
          Set-Location (Join-Path $tmp "tests_run")
          python -m pytest . --tb=short --import-mode=importlib

      - name: Smoke test on Windows 3.12 (avoid LLVM teardown assertion)
        if: runner.os == 'Windows' && matrix.python == '3.12'
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1
        run: |
          # Make sure we're not in the source directory
          Set-Location $env:TEMP

          python -c @"
          import pyorps
          import pyorps.utils._heap
          import pyorps.utils._raster_context
          import pyorps.utils._dijkstra
          import pyorps.utils._delta_stepping
          import pyorps.utils.path_algorithms as m
          import pyorps.utils.path_core as c
          print('Imported pyorps:', pyorps.__file__)
          print('Imported all Cython extensions and backward-compat shims')
          print('SUCCESS: All modules imported correctly!')
          "@

      - name: Smoke test on Windows 3.13 (avoid LLVM teardown assertion)
        if: runner.os == 'Windows' && matrix.python == '3.13'
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1
        run: |
          # Make sure we're not in the source directory
          Set-Location $env:TEMP

          python -c @"
          import pyorps
          import pyorps.utils._heap
          import pyorps.utils._raster_context
          import pyorps.utils._dijkstra
          import pyorps.utils._delta_stepping
          import pyorps.utils.path_algorithms as m
          import pyorps.utils.path_core as c
          print('Imported pyorps:', pyorps.__file__)
          print('Imported all Cython extensions and backward-compat shims')
          print('SUCCESS: All modules imported correctly!')
          "@

      - name: Run full tests on macOS from a temp directory
        if: runner.os == 'macOS'
        shell: bash
        run: |
          TMPDIR=$(mktemp -d)
          cp -r tests "$TMPDIR"/tests_run
          cd "$TMPDIR"/tests_run
          python -m pytest . --tb=short --import-mode=importlib

  publish:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist, test-wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          merge-multiple: true
          path: dist/

      - name: List all downloaded files
        run: |
          echo "Contents of dist/:"
          ls -la dist/

      - name: Collect distributions
        shell: bash
        run: |
          mkdir -p upload
          # Move wheels and source distributions
          find dist -name "*.whl" -exec mv {} upload/ \; 2>/dev/null || true
          find dist -name "*.tar.gz" -exec mv {} upload/ \; 2>/dev/null || true
          echo "Files to be uploaded:"
          ls -la upload/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload/
