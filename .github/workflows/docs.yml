name: Build and Deploy Docs

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.11

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gdal-bin libgdal-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Ensure we have setuptools>=77.0.0
          pip install "setuptools>=77.0.0" wheel
          # Install Cython and numpy first (build dependencies)
          pip install cython numpy
          # Install the project with graph extras for documentation
          pip install -e ".[graph]"
          # Install documentation dependencies
          pip install -r docs/source/requirements.txt

      - name: Build Cython extensions
        run: |
          # Build Cython extensions in-place
          python setup.py build_ext --inplace
          # Verify the extensions were built
          echo "Checking for built Cython extensions:"
          ls -la pyorps/utils/*.so 2>/dev/null || ls -la pyorps/utils/*.pyd 2>/dev/null || echo "No .so/.pyd files found"

      - name: Generate API documentation
        run: |
          cd docs
          mkdir -p source/_static
          
          # Clean old API docs to avoid conflicts
          rm -rf source/api
          rm -f source/api_*.rst
          rm -f source/modules*.rst
          
          # Generate API docs with sphinx-apidoc
          sphinx-apidoc -f -M -e -T -o source/api ../pyorps \
            ../pyorps/tests \
            ../pyorps/*test* \
            ../pyorps/case_studies \
            ../pyorps/examples
          
          # Create __init__.py for graph.api if it doesn't exist
          if [ ! -f "../pyorps/graph/api/__init__.py" ]; then
            cat > ../pyorps/graph/api/__init__.py << 'INITPY'
"""
Graph API Module
================

This module provides interfaces to various graph libraries for path finding.
"""

# Base API classes
from .graph_api import GraphAPI
from .graph_library_api import GraphLibraryAPI

__all__ = ['GraphAPI', 'GraphLibraryAPI']

# Optional imports
try:
    from .networkx_api import NetworkXAPI
    __all__.append('NetworkXAPI')
except ImportError:
    pass

try:
    from .rustworkx_api import RustworkxAPI
    __all__.append('RustworkxAPI')
except ImportError:
    pass

try:
    from .igraph_api import IgraphAPI
    __all__.append('IgraphAPI')
except ImportError:
    pass

try:
    from .networkit_api import NetworkitAPI
    __all__.append('NetworkitAPI')
except ImportError:
    pass

try:
    from .cython_api import CythonAPI
    __all__.append('CythonAPI')
except ImportError:
    pass
INITPY
          fi
          
          # Create a comprehensive modules documentation file
          cat > source/modules_all.rst << 'EOF'
