name: Build and Deploy Docs

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.11

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gdal-bin libgdal-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Ensure we have setuptools>=77.0.0 for proper license format support
          pip install "setuptools>=77.0.0" wheel
          # Install Cython and numpy first (build dependencies)
          pip install cython numpy
          # Install the project with graph extras for documentation
          pip install -e ".[graph]"
          # Install documentation dependencies
          pip install -r docs/source/requirements.txt

      - name: Build Cython extensions
        run: |
          # Build Cython extensions in-place
          python setup.py build_ext --inplace

      - name: Generate API documentation
        run: |
          cd docs
          # Create the _static directory if it doesn't exist
          mkdir -p source/_static
          # Auto-generate RST files for all modules
          sphinx-apidoc -f -o source/api ../pyorps

      - name: Build documentation
        run: |
          cd docs
          # Set PYTHONPATH to find the modules
      
