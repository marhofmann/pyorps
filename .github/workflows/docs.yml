          # Update index.rst to include the new module documentation
          if ! grep -q "modules_all" source/index.rst; then
            # Add modules_all after the toctree directive
            sed -i '/.. toctree::/a\   modules_all' source/index.rst
          fi

      - name: Build documentation
        run: |
          cd docs
          # Set PYTHONPATH to find the modules
          export PYTHONPATH="${PYTHONPATH}:$(pwd)/.."
          # Build with warnings as errors disabled for matplotlib roles
          sphinx-build -b html source _build/html || true

      - name: Check documentation output
        run: |
          echo "Checking if key modules are in documentation:"
          grep -r "pyorps.graph.api" docs/_build/html/*.html | head -5 || echo "graph.api not found"
          grep -r "pyorps.utils.path_core" docs/_build/html/*.html | head -5 || echo "path_core not found"

      - name: Trigger ReadTheDocs Build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: dfm/rtds-action@v1
        with:
          webhook_url: ${{ secrets.RTDS_WEBHOOK_URL }}
          webhook_token: ${{ secrets.RTDS_WEBHOOK_TOKEN }}
          commit_ref: ${{ github.ref }}
