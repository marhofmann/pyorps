name: Coverage Badge

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  coverage:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build
          pip install pytest pytest-cov requests coverage[toml]
          pip install -e .[full]

      - name: Run tests with coverage
        env:
          NUMBA_DISABLE_JIT: 1
        run: |
          python -m pytest --cov=pyorps tests/ --cov-config=pyproject.toml --cov-report=xml --cov-report=term-missing --cov-report=html

      - name: Display coverage report
        shell: pwsh
        run: |
          Write-Host "Coverage Report Summary:" -ForegroundColor Green
          Get-Content coverage.xml | Select-String -Pattern 'line-rate' | Select-Object -First 1
          python -c "import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); root = tree.getroot(); print(f\"Coverage: {float(root.get('line-rate'))*100:.2f}%\")"

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true
