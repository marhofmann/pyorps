[build-system]
requires = [
    "setuptools>=77",
    "wheel",
    "cython>=3.0.0",
    "numpy>=2.0.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "pyorps"
version = "0.3.2"
description = "PYORPS - (Python for Optimal Routes in Power Systems)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Martin Hofmann", email = "martin.hofmann-3@ei.thm.de"},
]
keywords = [
    "power line routing",
    "distribution grid",
    "power systems planning",
    "path finding",
    "rasterized GIS data",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "geopandas>=1.0.0",
    # Direct dependency since the bulk GeoJSON path (pyorps/raster/_geojson.py)
    # calls shapely.to_ragged_array; 2.0 is also geopandas 1.0's own floor.
    "shapely>=2.0.0",
    "numba>=0.61.0",
    "rasterio>=1.4.0",
    # Direct dependency since the forbidden-burn detector (raster/thinness.py)
    # calls scipy.ndimage.label for the corner-touching check. Without it that
    # half of the check silently does less, which is the cry-wolf-in-reverse
    # failure the detector exists to remove.
    "scipy>=1.11",
    "matplotlib>=3.10.0",
    "requests>=2.32.0",
    "defusedxml>=0.7.0",
    "psutil>=5.9.0",
]

[project.urls]
Homepage = "https://github.com/marhofmann/pyorps"
"Bug Tracker" = "https://github.com/marhofmann/pyorps/issues"

[project.optional-dependencies]
graph = [
    "rustworkx>=0.16.0",
    "python-igraph>=0.11.0",
    "networkx>=3.4.0",
    "networkit>=11.1",
]
dev = [
    "coverage[toml]>=7.8.0",
    "pytest>=8.3.0",
    "cython>=3.0.0",
]
examples = [
    "notebook>=7.4.0",
    "fiona>=1.10.0",
]
case_studies = [
    "notebook>=7.4.0",
    "fiona>=1.10.0",
    "pandapower>=3.0.0",
    "contextily>=1.6.0",
]
additionals = [
    "openpyxl>=3.1.0",
]
gui = [
    "dash>=3.0.0",
    "dash-leaflet>=1.1.0",
    "dash-ag-grid>=31.0.0",
    "dash-extensions>=1.0.0",
    "dash-bootstrap-components>=1.6.0",
    "localtileserver>=0.10.0",
    "pywebview>=5.0",
    "pyyaml>=6.0",
    # performance (2026-07-21 plan): orjson = fast callback/GeoJSON JSON
    # (Dash auto-uses it), flask-compress = gzip/brotli in browser mode,
    # pyarrow = pyogrio use_arrow fast reads, waitress = production WSGI
    # server on Windows, geobuf = binary vector wire format for the map.
    "orjson>=3.10",
    "flask-compress>=1.15",
    "pyarrow>=17.0",
    "waitress>=3.0",
    "geobuf>=1.1",
]
# deprecated alias of [gui] (kept for one release; pyorps.webviz is deprecated)
viz = [
    "dash>=3.0.0",
    "dash-leaflet>=1.1.0",
    "dash-ag-grid>=31.0.0",
    "dash-extensions>=1.0.0",
    "dash-bootstrap-components>=1.6.0",
    "localtileserver>=0.10.0",
    "pywebview>=5.0",
    "pyyaml>=6.0",
    "orjson>=3.10",
    "flask-compress>=1.15",
    "pyarrow>=17.0",
    "waitress>=3.0",
    "geobuf>=1.1",
]
gpu = [
    "cupy-cuda12x>=13.0.0",
]
gpu-full = [
    "cupy-cuda12x>=13.0.0",
    "cugraph-cu12>=25.02",
    "cudf-cu12>=25.02",
]
full = [
    # graph
    "rustworkx>=0.16.0",
    "python-igraph>=0.11.0",
    "networkx>=3.4.0",
    "networkit>=11.1",
    # dev
    "coverage[toml]>=7.8.0",
    "pytest>=8.3.0",
    "cython>=3.0.0",
    # examples
    "notebook>=7.4.0",
    "fiona>=1.10.0",
    # case_studies
    "pandapower>=3.0.0",
    "contextily>=1.6.0",
    # additionals
    "openpyxl>=3.1.0",
]

[tool.setuptools]
packages = [
    "pyorps",
    "pyorps.utils",
    "pyorps.graph",
    "pyorps.graph.api",
    "pyorps.core",
    "pyorps.io",
    "pyorps.raster",
    "pyorps.siting",
    "pyorps.collector",
    "pyorps.costmodel",
    "pyorps.certify",
    "pyorps.webviz",
    "pyorps.gui",
    "pyorps.gui.services",
    "pyorps.gui.callbacks",
]
include-package-data = true
zip-safe = false

[tool.setuptools.package-data]
pyorps = ["**/*.pyx", "**/*.pxd", "**/*.pxi"]
"pyorps.gui" = ["assets/*"]

[tool.coverage.run]
source = ["pyorps"]
relative_files = true
omit = [
    "tests/*",
    "docs/*",
    "case_studies/*",
    "examples/*",
    ".venv/*",
    ".github/*",
    "setup.py",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]
