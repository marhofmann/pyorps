[build-system]
requires = [
    "setuptools>=77",
    "wheel",
    "cython>=3.0.0",
    "numpy>=2.0.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "pyorps"
version = "0.4.0"
description = "PYORPS - (Python for Optimal Routes in Power Systems)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    {name = "Martin Hofmann", email = "martin.hofmann-3@ei.thm.de"},
]
keywords = [
    "power line routing",
    "distribution grid",
    "power systems planning",
    "path finding",
    "rasterized GIS data",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "geopandas>=1.0.0",
    # Direct dependency since the bulk GeoJSON path (pyorps/raster/_geojson.py)
    # calls shapely.to_ragged_array; 2.0 is also geopandas 1.0's own floor.
    "shapely>=2.0.0",
    "numba>=0.61.0",
    "rasterio>=1.4.0",
    # Direct dependency since the forbidden-burn detector (raster/thinness.py)
    # calls scipy.ndimage.label for the corner-touching check. Without it that
    # half of the check silently does less, which is the cry-wolf-in-reverse
    # failure the detector exists to remove.
    "scipy>=1.11",
    "matplotlib>=3.10.0",
    "requests>=2.32.0",
    "defusedxml>=0.7.0",
    "psutil>=5.9.0",
]

[project.urls]
Homepage = "https://github.com/marhofmann/pyorps"
"Bug Tracker" = "https://github.com/marhofmann/pyorps/issues"

[project.optional-dependencies]
graph = [
    "rustworkx>=0.16.0",
    "python-igraph>=0.11.0",
    "networkx>=3.4.0",
    # networkit has macOS wheels only for macOS 26+ (Python 3.14 and 3.15) or up to 11.1 (3.12, 3.13): elsewhere on macOS
    # pip would compile it (cmake, OpenMP). It stays an optional backend there; install it by hand on macOS 26+.
    "networkit>=11.1; sys_platform != 'darwin'",
]
dev = [
    "coverage[toml]>=7.8.0",
    "pytest>=8.3.0",
    "cython>=3.0.0",
    "ruff>=0.15,<0.16",
]
examples = [
    "notebook>=7.4.0",
    "fiona>=1.10.0; python_version < '3.14'",
]
case_studies = [
    "notebook>=7.4.0",
    "fiona>=1.10.0; python_version < '3.14'",
    # pandapower 3.2+ needs pandas < 3, and pandas 2 has no wheels for Python 3.15: with pandapower in the set, pip
    # would compile pandas from source there. Drop the marker once pandapower accepts pandas 3.
    "pandapower>=3.0.0; python_version < '3.15'",
    "contextily>=1.6.0",
    # the case studies read YAML data files (see the yaml extra)
    "pyyaml>=6.0",
]
additionals = [
    "openpyxl>=3.1.0",
]
# YAML files of the research packages (profiles, cost catalogue, data manifests); optional because PyYAML has no wheel
# for every new Python on the day it is released. Without it, reading or writing YAML raises MissingDependencyError.
yaml = [
    "pyyaml>=6.0",
]
gui = [
    "dash>=3.0.0",
    "dash-leaflet>=1.1.0",
    "dash-ag-grid>=31.0.0",
    "dash-extensions>=1.0.0",
    "dash-bootstrap-components>=1.6.0",
    "localtileserver>=0.10.0",
    "pywebview>=5.0",
    "pyyaml>=6.0",
    # performance (2026-07-21 plan): orjson = fast callback/GeoJSON JSON
    # (Dash auto-uses it), flask-compress = gzip/brotli in browser mode,
    # pyarrow = pyogrio use_arrow fast reads, waitress = production WSGI
    # server on Windows, geobuf = binary vector wire format for the map.
    "orjson>=3.10",
    "flask-compress>=1.15",
    "pyarrow>=17.0",
    "waitress>=3.0",
    "geobuf>=1.1",
]
# deprecated alias of [gui] (kept for one release; pyorps.webviz is deprecated)
viz = [
    "dash>=3.0.0",
    "dash-leaflet>=1.1.0",
    "dash-ag-grid>=31.0.0",
    "dash-extensions>=1.0.0",
    "dash-bootstrap-components>=1.6.0",
    "localtileserver>=0.10.0",
    "pywebview>=5.0",
    "pyyaml>=6.0",
    "orjson>=3.10",
    "flask-compress>=1.15",
    "pyarrow>=17.0",
    "waitress>=3.0",
    "geobuf>=1.1",
]
simplify = [
    # Rust-backed Visvalingam-Whyatt + RDP. The 1.x and 2.x releases ship the abi3 wheels that Python 3.15 needs;
    # the simplify tests pass on 0.7.14 and on 2.0.0.
    "simplification>=0.7,<3.0",
]
gpu = [
    "cupy-cuda12x>=13.0.0",
]
gpu-full = [
    "cupy-cuda12x>=13.0.0",
    "cugraph-cu12>=25.02",
    "cudf-cu12>=25.02",
]
full = [
    # graph
    "rustworkx>=0.16.0",
    "python-igraph>=0.11.0",
    "networkx>=3.4.0",
    # networkit has macOS wheels only for macOS 26+ (Python 3.14 and 3.15) or up to 11.1 (3.12, 3.13): elsewhere on macOS
    # pip would compile it (cmake, OpenMP). It stays an optional backend there; install it by hand on macOS 26+.
    "networkit>=11.1; sys_platform != 'darwin'",
    # dev
    "coverage[toml]>=7.8.0",
    "pytest>=8.3.0",
    "cython>=3.0.0",
    "ruff>=0.15,<0.16",
    # examples
    "notebook>=7.4.0",
    "fiona>=1.10.0; python_version < '3.14'",
    # case_studies
    # pandapower 3.2+ needs pandas < 3, and pandas 2 has no wheels for Python 3.15: with pandapower in the set, pip
    # would compile pandas from source there. Drop the marker once pandapower accepts pandas 3.
    "pandapower>=3.0.0; python_version < '3.15'",
    "contextily>=1.6.0",
    # yaml (also read by the case studies)
    "pyyaml>=6.0",
    # additionals
    "openpyxl>=3.1.0",
    # simplify
    "simplification>=0.7,<3.0",
]

[tool.setuptools]
packages = [
    "pyorps",
    "pyorps.utils",
    "pyorps.graph",
    "pyorps.graph.api",
    "pyorps.core",
    "pyorps.io",
    "pyorps.raster",
    "pyorps.siting",
    "pyorps.collector",
    "pyorps.costmodel",
    "pyorps.certify",
    "pyorps.webviz",
    "pyorps.gui",
    "pyorps.gui.services",
    "pyorps.gui.callbacks",
    "pyorps.gui.sections",
    "pyorps.utils.kernels",
]
include-package-data = true
zip-safe = false

[tool.setuptools.package-data]
pyorps = ["**/*.pyx", "**/*.pxd", "**/*.pxi", "**/*.cu", "**/*.cuh"]
"pyorps.gui" = ["assets/*"]

[tool.coverage.run]
source = ["pyorps"]
relative_files = true
omit = [
    "tests/*",
    "docs/*",
    "case_studies/*",
    "examples/*",
    ".venv/*",
    ".github/*",
    "setup.py",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Our own use of a deprecated API must fail the build the day the dependency deprecates it. Only warnings that
    # are attributed to pyorps code count: third-party code (rasterio 1.4 with affine 3, for example) warns on its own.
    'error::DeprecationWarning:pyorps\..*',
    'error::PendingDeprecationWarning:pyorps\..*',
]

# Ruff: the one linter for CI (.github/workflows/tests.yml, job "lint") and local runs:
#   python -m ruff check .
# Formatting is not enforced (no "ruff format" gate): the numerical kernels keep their hand-aligned layout.
[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
    "build",
    "docs/build",
    "output",
    "*.ipynb",              # notebooks are checked by tests/test_notebooks.py, not linted
]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, UP modern syntax for the supported Pythons, B likely bugs.
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "B905",   # zip() without strict=: the numerical code zips arrays whose equal length is established upstream
    "UP040",  # keep plain type aliases: they are imported and inspected at runtime, a `type` statement is not
    "UP042",  # keep (str, Enum): StrEnum changes str() and format() of members that are written to files
]

[tool.ruff.lint.per-file-ignores]
# Imports follow the thread-count and DLL set-up that must run first.
"pyorps/__init__.py" = ["E402"]
# Tests import after pytest.importorskip(), and their warnings need no stacklevel.
"tests/**" = ["E402", "B028"]
# Independent reference implementations for the collector checks, kept close to the mathematical notation
# (single-letter names, one-line statements) so they can be compared with the derivation line by line.
"tests/test_collector/**" = ["E402", "B028", "E741", "E702", "E701", "E731", "B023", "B007"]
# Study scripts: pyflakes errors still count, layout and loop-closure style do not.
"case_studies/**" = ["E501", "E741", "E702", "E731", "F403", "F405", "B023", "B007"]
"tutorial/**" = ["E501"]
"benchmarks/**" = ["E501"]
