# Copied into pyorps on 2026-09-24 from TopoMILP/examples/cost_assumptions/cost_catalogue_2026.yaml
# (source sha256 409063488d88bf5521f8cd6ff12b33cdbec2855740ededff79d22d4c3ca98a4c) per plan decision Q17 (everything in pyorps).
# The only change: the section 43h note of cross_check_cable_vs_ohl_ratio_by_voltage.
# enwg_regulatory_cap_up_to_110kv, corrected as plan rev. 5 section 15 (C1) asks.
# Internally-consistent cost catalogue for TopoMILP / CIRED2027 corridor & free-siting work.
# For narrative context, methodology, and reconciliation discussion see COST_CATALOGUE_2026.md.
#
# STRUCTURE: every leaf cost figure is an object with:
#   value (or low/high for a range), source (a key into the `references` block below),
#   confidence (HIGH/MEDIUM/LOW/INTERPOLATED -- see COST_CATALOGUE_2026.md section 0),
#   and an optional `note`.
# `source` may be a single ref key or a list of ref keys (cross-checked from multiple sources).
# `source: interpolated` means no direct source exists -- the value is derived from a stated
# ratio/rule found elsewhere in this file (see `note` for which one), or is a placeholder.
#
# v2 (2026-09-21): added lv_04kv, mv_overhead_line, mv_switchgear_by_voltage_class,
# protection_sensors_scada, station_buildings_security, personnel_and_om, dena_blended_topdown.
# The old (v1) cross_check_cable_vs_ohl_ratio_by_voltage.mv_hv_cable_ladder_dena entry (13x/10x)
# is SUPERSEDED by dena_blended_topdown (direct-read figures) -- do not use the old ratio.

