underground_cable_civil:
  # Layer ON TOP OF existing material cost tables (cost_assumptions_for_mv_lines.csv,
  # cost_assumptions_for_hv_lines.csv).
  # total_eur_per_m = material_eur_per_m * cores_per_circuit_multiplier + civil_base_eur_per_m * terrain_multiplier
  #
  # *** VALIDATION FIX (2026-09-21): cores_per_circuit_multiplier ***
  # cost_assumptions_for_hv_lines.csv prices ONE SINGLE-CORE 110kV XLPE cable per meter
  # (110kV cables are always laid as 3 separate single-core cables per 3-phase circuit,
  # unlike MV/LV cables which are commonly 3- or 4-core in a single sheath already
  # representing the full circuit). Naively summing that per-core price with the civil
  # layer as if it were already a full-circuit route-meter cost was checked numerically
  # and made underground cable come out CHEAPER than the equivalent overhead line
  # (0.55-0.83x of the OHL anchor at typical cross-sections) -- physically wrong and
  # directly contradicting this file's own cross_check_cable_vs_ohl_ratio_by_voltage
  # (cable should be ~2.5x OHL, not cheaper). Applying the x3 single-core multiplier
  # brings the ratio to 1.3-2.1x depending on cross-section -- correct direction, and
  # within reach of the 2.5x literature figure (residual gap plausibly land/engineering
  # overhead not captured by material+trench alone). See COST_CATALOGUE_2026.md section 7.1.
  cores_per_circuit_multiplier:
    hv_110kv_single_core_cables: {value: 3, source: interpolated, confidence: HIGH, note: "3x physical necessity, not a cost estimate -- 110kV cables are single-core, one per phase"}
    mv_lv_multicore_cable: {value: 1, source: interpolated, confidence: HIGH, note: "MV/LV tables already price a 3- or 4-core cable as one product per route-meter -- do NOT apply a x3 multiplier here"}
  civil_base_eur_per_m:
    mv_10_20_33_66kv: {value: 40, source: interpolated, confidence: INTERPOLATED, note: "cross-checked against 20-40% civil-fraction band from ramboll_desnz (validated: 22-44% across the MV material range, consistent); German utility Preisblätter (Wegekosten) are internal, not published"}
    hv_110kv: {value: 80, source: interpolated, confidence: INTERPOLATED, note: "= 2x MV, structural trench-sizing uplift from ramboll_desnz cable-count/trench-width tables; civil cost is per TRENCH, not per cable, so no cores multiplier applies here"}
  installation_method_multiplier:
    open_cut: {value: 1.00, source: interpolated, confidence: MEDIUM}
    cable_ploughing_unsealed_rural_only: {value: 0.30, source: ramboll_desnz, confidence: MEDIUM, note: "GB, transmission-scale, 28-34% of open-cut civils cost"}
  terrain_surface_multiplier:
