      q_methods: {value: ["Q(U)", "Q with voltage limitation function"], note: "switchable by telecontrol; on loss of telecontrol or of the plant controller, continue with the last valid setpoint", source: operator_a_tab_hs_2026, page: 14, confidence: confirmed}
