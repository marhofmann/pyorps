        turbines: {value: {"U>>": [1.25, "U_NS", 0.1], "U<": [0.80, "U_NS", "1.5/1.8/2.1/2.4 s staggered"], "U<<": [0.30, "U_NS", 0.8]}, note: "U_NS = U_MS / ue (ue: turbine transformer ratio)", source: operator_a_tab_hs_2026, page: 58, confidence: confirmed}
        q_u_protection: {value: {"U<": [0.85, "Un", 0.5], release: [0.95, "Un"], angle_deg: 3, q_min: "0.05 S_Amax"}, source: operator_a_tab_hs_2026, page: 57, confidence: confirmed}
      k_factor: {value: 5, where: "at the turbine", source: operator_a_tab_hs_2026, page: [15, 58], confidence: confirmed}
      network: {value: {un_kv: 110, um_kv: 123, ik_ka: 40, tk_s: 1, ip_ka: 80}, source: operator_a_tab_hs_2026, page: 7, confidence: confirmed}
      neutral: {value: "resonant earthed (kompensiert); an increase of the capacitive earth-fault current by the customer's plant needs the VNB's approval", source: operator_a_tab_hs_2026, page: 9, confidence: confirmed}
      connection: {value: "the VNB fixes the basic connection solution; the example in Anhang D is a 110 kV stub (Stichanschluss)", source: operator_a_tab_hs_2026, page: [6, 19], confidence: confirmed}
      controller_failure_option: {value: "form E.7 offers 'all turbines continue at cos phi 0.975 under-excited'", source: operator_a_tab_hs_2026, page: 59, confidence: confirmed}
    operator_b:
      entity: {value: "operator B (E.ON Netzrichtlinie NT-10-32)", source: operator_b_tab_hs_2019, page: 4, confidence: confirmed}
