      no_load_q_limit: {value: {under_excited: 0.05, over_excited: 0.02}, of: "P_b,inst, at the NAP, all turbines idle, park transformers, cables and other equipment included", note: "stated in the checklist for prototype plants (Anhang K)", source: operator_a_tab_hs_2026, page: 34, confidence: confirmed}
      planning_checks:             # Anhang K: load-flow checks the plant's electrical design must show
        stability_1: {value: [[0.90, 0.33], [0.90, 0.0], [1.10, 0.0], [1.10, -0.33]], axes: "U_NAP/Un (1.10 as Uc); Q_NAP/P_b,inst, positive = over-excited", p: "100 % P_b,inst", criterion: "no trip of the plant's or a turbine's decoupling protection (E.7 settings; turbine transformer tap considered, U_NS = Un / ue)", source: operator_a_tab_hs_2026, page: 34, confidence: confirmed}
        stability_3_busbar: {value: [[1.05, 0.33]], axes: "U_NAP/Un; Q_NAP/P_b,inst over-excited", criterion: "largest turbine voltage < 1.08 U_NS (no switch into FRT mode in undisturbed operation)", note: "connection at the busbar of a substation", source: operator_a_tab_hs_2026, page: 35, confidence: confirmed}
        stability_3_mv: {value: [[0.95, 0.0], [1.07, 0.0]], criterion: "> 0.92 U_NS and < 1.08 U_NS", note: "connection in the MV network (not this case)", source: operator_a_tab_hs_2026, page: 35, confidence: confirmed}
      protection_e7:               # form E.7, operator's settings (recommendation column = VDE-AR-N 4120)
        nap: {value: {"U>": [1.25, "Un", 0.5], "U<": [0.80, "Un", 5.0]}, units: "[factor, reference, delay s]", source: operator_a_tab_hs_2026, page: 57, confidence: confirmed}
